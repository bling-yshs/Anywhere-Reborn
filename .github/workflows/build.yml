name: 🛠️ 自动构建 (Auto Build)

on:
  push:
    branches:
      - master
      - restore-original-package


permissions:
  contents: read

jobs:
  build:
    name: 构建项目 (Build Project)
    runs-on: ubuntu-22.04

    steps:
      - name: 检出代码 (Checkout)
        uses: actions/checkout@v7

      - name: 安装 Java (Install Java)
        uses: actions/setup-java@v5
        with:
          distribution: liberica
          java-version: '21'

      - name: 配置 Gradle (Setup Gradle)
        uses: gradle/actions/setup-gradle@v6

      - name: 授予 Gradle Wrapper 执行权限 (Grant Gradle Wrapper Execute Permission)
        run: chmod +x gradlew

      - name: 恢复签名文件 (Restore Signing Keystore)
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/anywhere-reborn.jks"

      - name: 运行 Release 构建 (Run Release Build)
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/anywhere-reborn.jks
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease --console=plain

      - name: 上传构建产物 (Upload Build Artifacts)
        uses: actions/upload-artifact@v7
        with:
          path: app/build/outputs/apk/release/*.apk
          archive: false
          if-no-files-found: error

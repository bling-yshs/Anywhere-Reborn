name: 🛠️ 自动构建 (Auto Build)

on:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  build:
    name: 构建项目 (Build Project)
    runs-on: ubuntu-22.04

    steps:
      - name: 检出代码 (Checkout)
        uses: actions/checkout@v7

      - name: 安装 Java (Install Java)
        uses: actions/setup-java@v5
        with:
          distribution: liberica
          java-version: '21'

      - name: 配置 Gradle (Setup Gradle)
        uses: gradle/actions/setup-gradle@v6

      - name: 授予 Gradle Wrapper 执行权限 (Grant Gradle Wrapper Execute Permission)
        run: chmod +x gradlew

      - name: 运行 build 构建 (Run Gradle Build)
        run: ./gradlew --no-daemon assembleDebug --console=plain

      - name: 上传构建产物 (Upload Build Artifacts)
        uses: actions/upload-artifact@v7
        with:
          name: Anywhere-Reborn-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
